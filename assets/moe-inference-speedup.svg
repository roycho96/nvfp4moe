<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc">
<title id="title">Complete MoE inference speedup</title>
<desc id="desc">LightMoE complete routed-expert inference speedup over FlashInfer TensorRT-LLM across model-derived token counts.</desc>
<defs><style>
text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
.bg { fill:#f8fafc; } .panel { fill:#fff; stroke:#e2e8f0; stroke-width:1; }
.title { fill:#0f172a; font-size:30px; font-weight:650; } .subtitle { fill:#64748b; font-size:14px; }
.plot-title { fill:#0f172a; font-size:16px; font-weight:650; } .axis { fill:#475569; font-size:12px; }
.tick { fill:#64748b; font-size:11px; } .legend { fill:#334155; font-size:12px; font-weight:550; }
.grid { stroke:#e2e8f0; stroke-width:1; } .reference { stroke:#475569; stroke-width:1.8; stroke-dasharray:6 5; }
.line { fill:none; stroke-width:3; stroke-linecap:round; stroke-linejoin:round; }
.marker { fill:#fff; stroke-width:2.5; } .footer { fill:#64748b; font-size:11px; }
.zone-win { fill:#10b981; opacity:.07; } .zone-loss { fill:#e11d48; opacity:.06; }
.zone-label { fill:#475569; font-size:11px; font-weight:600; } .endpoint { font-size:12px; font-weight:650; }
.c0{stroke:#2563eb}.c1{stroke:#f97316}.c2{stroke:#10b981}.c3{stroke:#8b5cf6}.c4{stroke:#e11d48}.c5{stroke:#0891b2}
.fill0{fill:#2563eb}.fill1{fill:#f97316}.fill2{fill:#10b981}.fill3{fill:#8b5cf6}.fill4{fill:#e11d48}.fill5{fill:#0891b2}
@media(prefers-color-scheme:dark){
.bg{fill:#0b1220}.panel{fill:#111827;stroke:#273449}.title,.plot-title{fill:#f1f5f9}
.subtitle,.tick,.footer{fill:#94a3b8}.axis,.legend,.zone-label{fill:#cbd5e1}.grid{stroke:#273449}.reference{stroke:#94a3b8}.marker{fill:#111827}
.zone-win{fill:#34d399;opacity:.08}.zone-loss{fill:#fb7185;opacity:.07}
.c0{stroke:#60a5fa}.c1{stroke:#fb923c}.c2{stroke:#34d399}.c3{stroke:#a78bfa}.c4{stroke:#fb7185}.c5{stroke:#22d3ee}
.fill0{fill:#60a5fa}.fill1{fill:#fb923c}.fill2{fill:#34d399}.fill3{fill:#a78bfa}.fill4{fill:#fb7185}.fill5{fill:#22d3ee}
}
</style></defs>
