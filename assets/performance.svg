  <rect class="track" x="350" y="297" width="260" height="14" rx="7"/>
  <rect class="gemm-bar" x="350" y="297" width="81" height="14" rx="7"/>
  <line class="range" x1="407" y1="304" x2="431" y2="304"/>
  <circle class="range-dot" cx="407" cy="304" r="3"/>
  <circle class="range-dot" cx="431" cy="304" r="3"/>
  <text class="value" x="674" y="309" text-anchor="end">1.11–1.16×</text>

  <text class="label" x="64" y="349">Kimi-K3</text>
  <rect class="track" x="350" y="337" width="260" height="14" rx="7"/>
  <rect class="gemm-bar" x="350" y="337" width="256" height="14" rx="7"/>
  <line class="range" x1="551" y1="344" x2="606" y2="344"/>
  <circle class="range-dot" cx="551" cy="344" r="3"/>
  <circle class="range-dot" cx="606" cy="344" r="3"/>
  <text class="value" x="674" y="349" text-anchor="end">1.39–1.49×</text>

  <text class="label" x="64" y="389">GLM-5.2</text>
  <rect class="track" x="350" y="377" width="260" height="14" rx="7"/>
  <rect class="gemm-bar" x="350" y="377" width="53" height="14" rx="7"/>
  <line class="range" x1="389" y1="384" x2="403" y2="384"/>
  <circle class="range-dot" cx="389" cy="384" r="3"/>
  <circle class="range-dot" cx="403" cy="384" r="3"/>
  <text class="value" x="674" y="389" text-anchor="end">1.08–1.10×</text>

