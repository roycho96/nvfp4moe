  <rect class="track" x="350" y="417" width="260" height="14" rx="7"/>
  <rect class="gemm-bar" x="350" y="417" width="54" height="14" rx="7"/>
  <line class="range" x1="397" y1="424" x2="404" y2="424"/>
  <circle class="range-dot" cx="397" cy="424" r="3"/>
  <circle class="range-dot" cx="404" cy="424" r="3"/>
  <text class="value" x="674" y="429" text-anchor="end">1.09–1.10×</text>

  <text class="label" x="64" y="469">Nemotron-3.5 30B-A3B</text>
  <rect class="track" x="350" y="457" width="260" height="14" rx="7"/>
  <rect class="gemm-bar" x="350" y="457" width="79" height="14" rx="7"/>
  <line class="range" x1="354" y1="464" x2="429" y2="464"/>
  <circle class="range-dot" cx="354" cy="464" r="3"/>
  <circle class="range-dot" cx="429" cy="464" r="3"/>
  <text class="value" x="674" y="469" text-anchor="end">1.01–1.15×</text>

  <text class="tick" x="350" y="508" text-anchor="middle">1.0×</text>
  <text class="tick" x="402" y="508" text-anchor="middle">1.1×</text>
  <text class="tick" x="454" y="508" text-anchor="middle">1.2×</text>
  <text class="tick" x="506" y="508" text-anchor="middle">1.3×</text>
  <text class="tick" x="558" y="508" text-anchor="middle">1.4×</text>
  <text class="tick" x="610" y="508" text-anchor="middle">1.5×</text>
  <text class="panel-subtitle" x="64" y="545">8,192 tokens per EP rank · balanced routing</text>

  <rect class="panel" x="710" y="116" width="450" height="458" rx="18"/>
  <text class="panel-title" x="734" y="154">Routed-expert training</text>
  <text class="panel-subtitle" x="734" y="178">Fwd+bwd latency reduction vs Transformer Engine NVFP4</text>

  <line class="baseline" x1="860" y1="207" x2="860" y2="460"/>
  <line class="grid" x1="931" y1="207" x2="931" y2="460"/>
  <line class="grid" x1="1003" y1="207" x2="1003" y2="460"/>
  <line class="grid" x1="1074" y1="207" x2="1074" y2="460"/>

  <text class="label" x="734" y="253">Qwen3.5-35B</text>
  <rect class="track" x="860" y="239" width="250" height="16" rx="8"/>
  <rect class="training-bar" x="860" y="239" width="224" height="16" rx="8"/>
  <line class="training-range" x1="1076" y1="247" x2="1084" y2="247"/>
  <circle class="training-dot" cx="1076" cy="247" r="3"/>
  <circle class="training-dot" cx="1084" cy="247" r="3"/>
  <text class="value" x="1138" y="253" text-anchor="end">30.2–31.4%</text>

  <text class="label" x="734" y="338">Qwen3.5-397B</text>
  <rect class="track" x="860" y="324" width="250" height="16" rx="8"/>
  <rect class="training-bar" x="860" y="324" width="199" height="16" rx="8"/>
  <line class="training-range" x1="1057" y1="332" x2="1059" y2="332"/>
  <circle class="training-dot" cx="1057" cy="332" r="3"/>
  <circle class="training-dot" cx="1059" cy="332" r="3"/>
  <text class="value" x="1138" y="338" text-anchor="end">27.6–27.9%</text>

  <text class="label" x="734" y="423">GLM-5.2</text>
  <rect class="track" x="860" y="409" width="250" height="16" rx="8"/>
  <rect class="training-bar" x="860" y="409" width="168" height="16" rx="8"/>
  <line class="training-range" x1="1025" y1="417" x2="1028" y2="417"/>
  <circle class="training-dot" cx="1025" cy="417" r="3"/>
  <circle class="training-dot" cx="1028" cy="417" r="3"/>
  <text class="value" x="1138" y="423" text-anchor="end">23.1–23.5%</text>

  <text class="tick" x="860" y="484" text-anchor="middle">0%</text>
  <text class="tick" x="931" y="484" text-anchor="middle">10%</text>
  <text class="tick" x="1003" y="484" text-anchor="middle">20%</text>
  <text class="tick" x="1074" y="484" text-anchor="middle">30%</text>
  <text class="panel-subtitle" x="734" y="545">8,192 tokens · balanced and imbalanced routing</text>

  <rect class="band" x="40" y="594" width="1120" height="72" rx="14"/>
  <text class="band-title" x="64" y="622">DeepSeek V4 full-model serving · vLLM</text>
  <text class="band-label" x="64" y="646">Only the NVFP4 MoE backend changes</text>
  <text class="band-label" x="720" y="622">Prefill</text>
  <text class="band-value" x="720" y="647">1.10–1.13×</text>
  <text class="band-label" x="930" y="622">Decode</text>
  <text class="band-value" x="930" y="647">1.043–1.045×</text>

  <text class="footer" x="56" y="696">Median ranges; exact hardware, boundaries, IQRs, and validity gates are in BENCHMARKS.md.</text>
</svg>
