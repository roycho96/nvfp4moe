[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lightmoe"
dynamic = ["version"]
description = "CuTe DSL NVFP4 GEMM and MoE kernels for NVIDIA Blackwell SM100"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
    {name = "Sung Hyun Cho", email = "hope5487@gmail.com"},
]
keywords = ["blackwell", "cuda", "cute-dsl", "mixture-of-experts", "nvfp4"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "apache-tvm-ffi>=0.1.6,<0.2",
    "cuda-python>=13,<14",
    "nvidia-cutlass-dsl>=4.6,<4.8",
    "torch>=2.11",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "ruff>=0.12",
]

[project.urls]
Homepage = "https://github.com/roycho96/lightmoe"
Repository = "https://github.com/roycho96/lightmoe"
Issues = "https://github.com/roycho96/lightmoe/issues"
Benchmarks = "https://github.com/roycho96/lightmoe/blob/main/BENCHMARKS.md"

[tool.setuptools.dynamic]
version = {attr = "lightmoe.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["lightmoe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
exclude = ["third_party"]

[tool.ruff.lint]
ignore = [
    "E731",
    "E741",
    "F841",
]
