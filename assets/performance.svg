<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">LightMoE performance on NVIDIA Blackwell</title>
  <desc id="desc">Model-derived grouped NVFP4 GEMM speedup over the fastest runnable baseline, routed-expert training latency reduction versus Transformer Engine, and DeepSeek V4 full-model serving speedup.</desc>
  <defs>
    <style>
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .background { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #e2e8f0; }
      .band { fill: #eef2ff; }
      .title { fill: #0f172a; font-size: 32px; font-weight: 600; }
      .subtitle { fill: #64748b; font-size: 15px; }
      .panel-title { fill: #0f172a; font-size: 20px; font-weight: 600; }
      .panel-subtitle { fill: #64748b; font-size: 13px; }
      .label { fill: #334155; font-size: 12px; font-weight: 500; }
      .tick { fill: #64748b; font-size: 11px; }
      .value { fill: #0f172a; font-size: 12px; font-weight: 600; }
      .grid { stroke: #e2e8f0; stroke-width: 1; }
      .baseline { stroke: #94a3b8; stroke-width: 1.5; }
      .track { fill: #e2e8f0; }
      .gemm-bar { fill: #10b981; }
      .training-bar { fill: #6366f1; }
      .range { stroke: #0f766e; stroke-width: 2; }
      .range-dot { fill: #0f766e; }
      .training-range { stroke: #312e81; stroke-width: 2; }
      .training-dot { fill: #312e81; }
      .band-title { fill: #312e81; font-size: 14px; font-weight: 600; }
      .band-label { fill: #64748b; font-size: 12px; }
      .band-value { fill: #312e81; font-size: 16px; font-weight: 600; }
      .footer { fill: #64748b; font-size: 12px; }
      @media (prefers-color-scheme: dark) {
        .background { fill: #0b1220; }
        .panel { fill: #111827; stroke: #273449; }
        .band { fill: #18213b; }
        .title, .panel-title, .value { fill: #f1f5f9; }
        .subtitle, .panel-subtitle, .tick, .footer, .band-label { fill: #94a3b8; }
        .label { fill: #cbd5e1; }
        .grid { stroke: #273449; }
        .baseline { stroke: #64748b; }
        .track { fill: #273449; }
        .gemm-bar { fill: #34d399; }
        .training-bar { fill: #818cf8; }
        .range { stroke: #5eead4; }
        .range-dot { fill: #5eead4; }
        .training-range { stroke: #a5b4fc; }
        .training-dot { fill: #a5b4fc; }
        .band-title, .band-value { fill: #c7d2fe; }
      }
    </style>
  </defs>

  <rect class="background" width="1200" height="720" rx="24"/>

  <text class="title" x="56" y="61">LightMoE on NVIDIA Blackwell</text>
  <text class="subtitle" x="56" y="88">Grouped NVFP4 GEMM · routed-expert training · full-model serving</text>

  <rect class="panel" x="40" y="116" width="650" height="458" rx="18"/>
  <text class="panel-title" x="64" y="154">Grouped NVFP4 GEMM</text>
  <text class="panel-subtitle" x="64" y="178">Gate/up and down range vs fastest runnable baseline · higher is better</text>

  <line class="baseline" x1="350" y1="200" x2="350" y2="486"/>
  <line class="grid" x1="402" y1="200" x2="402" y2="486"/>
  <line class="grid" x1="454" y1="200" x2="454" y2="486"/>
  <line class="grid" x1="506" y1="200" x2="506" y2="486"/>
  <line class="grid" x1="558" y1="200" x2="558" y2="486"/>
  <line class="grid" x1="610" y1="200" x2="610" y2="486"/>

  <text class="label" x="64" y="229">Qwen3.5-35B-A3B</text>
  <rect class="track" x="350" y="217" width="260" height="14" rx="7"/>
  <rect class="gemm-bar" x="350" y="217" width="126" height="14" rx="7"/>
  <line class="range" x1="352" y1="224" x2="476" y2="224"/>
  <circle class="range-dot" cx="352" cy="224" r="3"/>
  <circle class="range-dot" cx="476" cy="224" r="3"/>
  <text class="value" x="674" y="229" text-anchor="end">1.00–1.24×</text>

  <text class="label" x="64" y="269">Qwen3.5-397B-A17B</text>
  <rect class="track" x="350" y="257" width="260" height="14" rx="7"/>
  <rect class="gemm-bar" x="350" y="257" width="83" height="14" rx="7"/>
  <line class="range" x1="431" y1="264" x2="433" y2="264"/>
  <circle class="range-dot" cx="431" cy="264" r="3"/>
  <circle class="range-dot" cx="433" cy="264" r="3"/>
  <text class="value" x="674" y="269" text-anchor="end">1.16×</text>

